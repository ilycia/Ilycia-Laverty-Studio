<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Art | Ilycia Laverty</title>

    <link
        rel="stylesheet"
        href="../assets/css/style.css">

    <link
        rel="icon"
        href="../assets/images/ui/makersmark.svg"
        type="image/svg+xml">

</head>


<body class="art-page">


    <!-- ==========================================
        STUDIO COMPONENTS
    ========================================== -->

    <div
        id="field-kit"
        data-fieldkit-variant="paper">
    </div>


    <!-- ==========================================
        GALLERY WALL (ART HOME PAGE)
    ========================================== -->

    <section class="gallery-wall">

        <a
            class="gallery-left"
            href="../collection/#preservation">

            <img
                src="../assets/images/projects/art/preservation.webp"
                alt="Preservation">

        </a>


        <a
            class="gallery-centre"
            href="../collection/#sarabande">

            <img
                src="../assets/images/projects/art/midnightnudeseries-sarabande.webp"
                alt="Sarabande">

        </a>


        <a
            class="gallery-right"
            href="../collection/#loure">

            <img
                src="../assets/images/projects/art/midnightnudeseries-loure.webp"
                alt="Loure">

        </a>

    </section>


    <footer class="collection-link">

        <a href="../collection/">

            Enter the Collection →

        </a>

    </footer>


    <script src="../assets/js/script.js"></script>
    <script src="../assets/js/fieldkit.js"></script>

</html>
