<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Art | Ilycia Laverty</title>

    <link rel="stylesheet"
          href="../assets/css/style.css">

</head>

<body class="art-page">

    <!-- ==========================================
         FIELD KIT
    ========================================== -->

    <aside class="field-kit">

        <a href="../index.html"
           class="maker-mark">

            <img src="../assets/images/ui/makersmark.svg"
                 alt="Maker's Mark">

        </a>

        <button class="menu-button">

            ☰

        </button>

        <label class="search">

            <input
                type="search"
                placeholder="Search the Studio...">

    <!-- ==========================================

    ========================================== -->

    <main class="page exhibition">

        <p class="page-tagline">

        </h1>


        <section class="exhibition-works">

            <a href="collection/#preservation">

            <a href="collection/#sarabande">

                <img
                    src="../assets/images/projects/art/midnightnudeseries-sarabande.webp"

            <a href="collection/#loure">

                <img
                    src="../assets/images/projects/art/midnightnudeseries-loure.webp"

        <footer class="collection-link">

            <a href="collection/">
